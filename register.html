<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08101f">
<title>Register Admin — Daily Tasks Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="brand-mark">✓</div>
  <h1>Create Admin Account</h1>
  <p class="muted">Register an account to manage your team.</p>

  <form id="registerForm" class="panel">
    <label>Full Name<input id="name" type="text" required></label>
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password
      <span class="password-wrap">
        <input id="password" type="password" minlength="6" required autocomplete="new-password">
        <button type="button" class="eye" data-target="password">👁</button>
      </span>
    </label>
    <label>Confirm Password
      <span class="password-wrap">
        <input id="confirm" type="password" minlength="6" required autocomplete="new-password">
        <button type="button" class="eye" data-target="confirm">👁</button>
      </span>
    </label>
    <button class="primary full" type="submit">Create Account</button>
    <div id="message" class="message"></div>
  </form>
  <p class="auth-link"><a href="index.html">Back to Sign In</a></p>
</div>
<script type="module" src="js/register.js"></script>
</body>
</html>
