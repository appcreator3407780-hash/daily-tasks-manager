<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08101f">
<title>Daily Tasks Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="brand-mark">✓</div>
  <h1>Daily Tasks Manager</h1>
  <p class="muted">Manage people. Assign work. Track progress.</p>

  <form id="loginForm" class="panel">
    <h2>Welcome back</h2>
    <p class="muted">Sign in to continue</p>

    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password
      <span class="password-wrap">
        <input id="password" type="password" required autocomplete="current-password">
        <button type="button" class="eye" data-target="password">👁</button>
      </span>
    </label>

    <button class="primary full" type="submit">Sign In</button>
    <div id="message" class="message"></div>
  </form>

  <p class="auth-link">Don't have an account? <a href="register.html">Register as Admin</a></p>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
