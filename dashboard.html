<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#080b14">

<title>Daily Tasks Manager</title>

<link rel="stylesheet" href="css/style.css">

<style>

body {
  margin: 0;
  background: #080b14;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

.dashboard {
  min-height: 100vh;
}

.topbar {
  height: 70px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 24px;

  background: #0b0f1b;

  border-bottom: 1px solid #20283b;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 12px;

  background: #5b7cff;

  font-weight: 800;
}

.title {
  font-weight: 750;
}

.subtitle {
  color: #929bb0;
  font-size: 12px;
  margin-top: 2px;
}

.logout {
  border: 1px solid #30394e;

  background: #111625;

  color: white;

  padding: 9px 14px;

  border-radius: 10px;

  cursor: pointer;
}

.content {
  max-width: 1100px;

  margin: auto;

  padding: 28px 18px 50px;
}

.page-heading {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 15px;

  margin-bottom: 22px;
}

.page-heading h1 {
  font-size: 27px;
  margin: 0;
}

.page-heading p {
  color: #929bb0;

  margin-top: 5px;

  font-size: 14px;
}

.add-btn {
  border: 0;

  background: #5b7cff;

  color: white;

  padding: 11px 16px;

  border-radius: 11px;

  font-weight: 700;

  cursor: pointer;
}

.stats {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 14px;

  margin-bottom: 20px;
}

.stat {
  background: #111625;

  border: 1px solid #20283b;

  border-radius: 16px;

  padding: 18px;
}

.stat-number {
  font-size: 26px;
  font-weight: 800;
}

.stat-label {
  color: #929bb0;

  font-size: 13px;

  margin-top: 5px;
}

.search-box {
  margin-bottom: 18px;
}

.search-box input {
  box-sizing: border-box;

  width: 100%;

  height: 48px;

  padding: 0 15px;

  border-radius: 12px;

  border: 1px solid #20283b;

  outline: none;

  background: #111625;

  color: white;
}

.users {
  display: grid;
  gap: 12px;
}

.user-card {
  background: #111625;

  border: 1px solid #20283b;

  border-radius: 16px;

  padding: 16px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;
}

.user-info {
  display: flex;

  align-items: center;

  gap: 13px;

  min-width: 0;
}

.avatar {
  width: 45px;
  height: 45px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #202a46;

  color: #aebcff;

  font-weight: 800;
}

.user-name {
  font-weight: 700;
}

.user-email {
  color: #929bb0;

  font-size: 12px;

  margin-top: 3px;
}

.user-actions {
  display: flex;
  gap: 7px;
}

.small-btn {
  border: 1px solid #30394e;

  background: #0d1320;

  color: white;

  padding: 8px 10px;

  border-radius: 9px;

  cursor: pointer;
}

.small-btn.delete {
  color: #ff7d89;
}

.empty {
  text-align: center;

  padding: 45px 15px;

  background: #111625;

  border: 1px solid #20283b;

  border-radius: 16px;

  color: #929bb0;
}

.empty-icon {
  font-size: 38px;
  margin-bottom: 10px;
}

.loading-screen {
  min-height: 100vh;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 20px;

  box-sizing: border-box;
}

.loading-box {
  max-width: 420px;
}

.loading-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 10px;
}

.loading-text {
  color: #929bb0;
  line-height: 1.5;
}

.error-text {
  color: #ff7d89;
  margin-top: 12px;
  word-break: break-word;
}


/* MODAL */

.modal {
  position: fixed;

  inset: 0;

  z-index: 100;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 18px;

  background: rgba(0,0,0,.68);
}

.modal.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 430px;

  box-sizing: border-box;

  background: #111625;

  border: 1px solid #283149;

  border-radius: 20px;

  padding: 22px;
}

.modal-header {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;
}

.close {
  border: 0;

  background: transparent;

  color: #929bb0;

  font-size: 25px;

  cursor: pointer;
}

.form-field {
  margin-bottom: 15px;
}

.form-field label {
  display: block;

  margin-bottom: 7px;

  font-size: 13px;

  font-weight: 600;
}

.form-field input {
  box-sizing: border-box;

  width: 100%;

  height: 47px;

  padding: 0 13px;

  border-radius: 11px;

  border: 1px solid #273149;

  background: #0b101d;

  color: white;

  outline: none;
}

.save-btn {
  width: 100%;

  height: 48px;

  border: 0;

  border-radius: 11px;

  background: #5b7cff;

  color: white;

  font-weight: 700;

  cursor: pointer;
}

.form-message {
  min-height: 20px;

  margin-top: 10px;

  text-align: center;

  font-size: 13px;
}


@media(max-width:650px) {

  .topbar {
    padding: 0 14px;
  }

  .content {
    padding: 22px 14px 40px;
  }

  .page-heading {
    align-items: flex-start;
  }

  .page-heading h1 {
    font-size: 23px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .user-card {
    align-items: flex-start;
  }

  .user-actions {
    flex-direction: column;
  }

}

</style>

</head>

<body>


<!-- LOADING -->

<div
  id="loadingScreen"
  class="loading-screen"
>

  <div class="loading-box">

    <div class="loading-title">
      Daily Tasks Manager
    </div>

    <div class="loading-text">
      Checking your account...
    </div>

    <div
      id="loadingError"
      class="error-text"
    ></div>

  </div>

</div>



<!-- DASHBOARD -->

<div
  id="dashboard"
  class="dashboard"
  style="display:none;"
>


<header class="topbar">

  <div class="brand-area">

    <div class="logo">
      ✓
    </div>

    <div>

      <div class="title">
        Daily Tasks Manager
      </div>

      <div class="subtitle">
        Admin Dashboard
      </div>

    </div>

  </div>


  <button
    id="logoutBtn"
    class="logout"
  >
    Logout
  </button>

</header>



<main class="content">


<section class="page-heading">

  <div>

    <h1>
      Users
    </h1>

    <p id="welcome">
      Manage your users
    </p>

  </div>


  <button
    id="openAddUser"
    class="add-btn"
  >
    + Add User
  </button>

</section>



<section class="stats">

  <div class="stat">

    <div
      id="totalUsers"
      class="stat-number"
    >
      0
    </div>

    <div class="stat-label">
      Total Users
    </div>

  </div>


  <div class="stat">

    <div
      id="activeUsers"
      class="stat-number"
    >
      0
    </div>

    <div class="stat-label">
      Active Users
    </div>

  </div>


  <div class="stat">

    <div
      id="totalTasks"
      class="stat-number"
    >
      0
    </div>

    <div class="stat-label">
      0
    </div>

  </div>

</section>



<div class="search-box">

  <input
    id="searchInput"
    type="search"
    placeholder="Search users by name or email..."
  >

</div>



<section id="usersContainer">

  <div class="empty">

    <div class="empty-icon">
      👥
    </div>

    Loading users...

  </div>

</section>


</main>

</div>



<!-- ADD USER -->

<div
  id="userModal"
  class="modal"
>

  <div class="modal-card">

    <div class="modal-header">

      <h2>
        Create User
      </h2>

      <button
        id="closeModal"
        class="close"
      >
        ×
      </button>

    </div>


    <form id="userForm">

      <div class="form-field">

        <label>
          Full Name
        </label>

        <input
          id="userName"
          type="text"
          placeholder="Enter user name"
          required
        >

      </div>


      <div class="form-field">

        <label>
          Email
        </label>

        <input
          id="userEmail"
          type="email"
          placeholder="user@example.com"
          required
        >

      </div>


      <div class="form-field">

        <label>
          Password
        </label>

        <input
          id="userPassword"
          type="password"
          placeholder="Minimum 6 characters"
          minlength="6"
          required
        >

      </div>


      <button
        class="save-btn"
        type="submit"
      >
        Create User
      </button>


      <div
        id="formMessage"
        class="form-message"
      ></div>

    </form>

  </div>

</div>



<script type="module">


import {
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


import {
  auth,
  db
} from "./js/firebase-config.js";


let currentAdmin = null;

let allUsers = [];

let authFinished = false;



/* ==========================================
   AUTHENTICATION
========================================== */

onAuthStateChanged(
  auth,
  async (user) => {

    console.log(
      "Dashboard auth state:",
      user
    );


    /*
     * Firebase has now finished checking
     * the saved login session.
     */

    authFinished = true;


    if (!user) {

      /*
       * Do NOT immediately redirect.
       *
       * Show a clear message instead.
       */

      document
        .querySelector(".loading-text")
        .textContent =
        "You are not logged in.";

      document
        .getElementById("loadingError")
        .textContent =
        "Please return to the login page and sign in again.";

      setTimeout(
        () => {

          window.location.href =
            "index.html";

        },
        1500
      );

      return;

    }


    try {

      console.log(
        "Firebase UID:",
        user.uid
      );


      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );


      const profileSnap =
        await getDoc(
          profileRef
        );


      console.log(
        "Profile exists:",
        profileSnap.exists()
      );


      if (!profileSnap.exists()) {

        /*
         * IMPORTANT:
         *
         * Do NOT sign the user out here.
         *
         * This lets us see the actual
         * problem instead of creating a
         * redirect loop.
         */

        document
          .querySelector(".loading-text")
          .textContent =
          "Account profile not found.";

        document
          .getElementById("loadingError")
          .textContent =
          "Firebase UID: " +
          user.uid;

        return;

      }


      const data =
        profileSnap.data();


      console.log(
        "Profile data:",
        data
      );


      if (
        data.status ===
        "disabled"
      ) {

        document
          .querySelector(".loading-text")
          .textContent =
          "This account is disabled.";

        return;

      }


      if (
        data.role !== "admin" &&
        data.role !== "super_admin"
      ) {

        document
          .querySelector(".loading-text")
          .textContent =
          "This account is not an admin account.";

        document
          .getElementById("loadingError")
          .textContent =
          "Current role: " +
          (data.role || "undefined");

        return;

      }


      /*
       * Everything is okay.
       */

      currentAdmin = {

        uid: user.uid,

        ...data

      };


      document
        .getElementById("welcome")
        .textContent =
        "Welcome, " +
        (
          data.name ||
          user.email ||
          "Admin"
        );


      /*
       * Show dashboard.
       */

      document
        .getElementById(
          "loadingScreen"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "dashboard"
        )
        .style.display =
        "block";


      /*
       * Load users.
       */

      await loadUsers();


    } catch (error) {

      console.error(
        "Dashboard error:",
        error
      );


      /*
       * IMPORTANT:
       * Don't redirect on error.
       */

      document
        .querySelector(".loading-text")
        .textContent =
        "Dashboard error";


      document
        .getElementById("loadingError")
        .textContent =
        error.code ||
        error.message ||
        String(error);

    }

  }
);



/* ==========================================
   LOAD USERS
========================================== */

async function loadUsers() {

  try {

    const usersRef =
      collection(
        db,
        "users"
      );


    const q =
      query(
        usersRef,
        where(
          "createdBy",
          "==",
          currentAdmin.uid
        )
      );


    const snapshot =
      await getDocs(q);


    allUsers = [];


    snapshot.forEach(
      item => {

        if (
          item.id !==
          currentAdmin.uid
        ) {

          allUsers.push({

            id: item.id,

            ...item.data()

          });

        }

      }
    );


    updateStats();

    renderUsers(
      allUsers
    );


  } catch (error) {

    console.error(
      "Load users error:",
      error
    );


    document
      .getElementById(
        "usersContainer"
      )
      .innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          Unable to load users.

          <br><br>

          <small>
            ${escapeHTML(
              error.message
            )}
          </small>

        </div>

      `;

  }

}



/* ==========================================
   STATS
========================================== */

function updateStats() {

  document
    .getElementById(
      "totalUsers"
    )
    .textContent =
    allUsers.length;


  document
    .getElementById(
      "activeUsers"
    )
    .textContent =
    allUsers.filter(
      user =>
        user.status !==
        "disabled"
    ).length;


  document
    .getElementById(
      "totalTasks"
    )
    .textContent =
    "0";

}



/* ==========================================
   RENDER USERS
========================================== */

function renderUsers(
  users
) {

  const container =
    document.getElementById(
      "usersContainer"
    );


  if (!users.length) {

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          👤
        </div>

        <div>
          No users found
        </div>

        <small>
          Create your first user.
        </small>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  users.forEach(
    user => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "user-card";


      const initial =
        (
          user.name ||
          "U"
        )
        .charAt(0)
        .toUpperCase();


      card.innerHTML = `

        <div class="user-info">

          <div class="avatar">
            ${escapeHTML(
              initial
            )}
          </div>

          <div>

            <div class="user-name">

              ${escapeHTML(
                user.name ||
                "Unnamed User"
              )}

            </div>

            <div class="user-email">

              ${escapeHTML(
                user.email ||
                ""
              )}

            </div>

          </div>

        </div>


        <div class="user-actions">

          <button
            class="small-btn"
            data-view="${user.id}"
          >
            View
          </button>

          <button
            class="small-btn delete"
            data-delete="${user.id}"
          >
            Delete
          </button>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );


  document
    .querySelectorAll(
      "[data-view]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const user =
              allUsers.find(
                item =>
                  item.id ===
                  button.dataset.view
              );


            if (!user) return;


            alert(
              "User: " +
              user.name +
              "\nEmail: " +
              user.email +
              "\nStatus: " +
              user.status
            );

          }
        );

      }
    );


  document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            deleteUserProfile(
              button.dataset.delete
            );

          }
        );

      }
    );

}



/* ==========================================
   SEARCH
========================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    event => {

      const value =
        event.target.value
          .trim()
          .toLowerCase();


      const filtered =
        allUsers.filter(
          user =>

            (
              user.name ||
              ""
            )
            .toLowerCase()
            .includes(value)

            ||

            (
              user.email ||
              ""
            )
            .toLowerCase()
            .includes(value)

        );


      renderUsers(
        filtered
      );

    }
  );



/* ==========================================
   DELETE USER PROFILE
========================================== */

async function deleteUserProfile(
  id
) {

  const user =
    allUsers.find(
      item =>
        item.id === id
    );


  if (!user) return;


  if (
    !confirm(
      `Delete ${user.name || "this user"}?`
    )
  ) {

    return;

  }


  try {

    await deleteDoc(
      doc(
        db,
        "users",
        id
      )
    );


    await loadUsers();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "Unable to delete user: " +
      error.message
    );

  }

}



/* ==========================================
   MODAL
========================================== */

const modal =
  document.getElementById(
    "userModal"
  );


document
  .getElementById(
    "openAddUser"
  )
  .addEventListener(
    "click",
    () => {

      modal.classList.add(
        "show"
      );

    }
  );


document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    () => {

      modal.classList.remove(
        "show"
      );

    }
  );


modal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      modal
    ) {

      modal.classList.remove(
        "show"
      );

    }

  }
);



/* ==========================================
   CREATE USER PROFILE
========================================== */

document
  .getElementById(
    "userForm"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const message =
        document.getElementById(
          "formMessage"
        );


      const name =
        document
          .getElementById(
            "userName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "userEmail"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "userPassword"
          )
          .value;


      if (
        password.length < 6
      ) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;

      }


      try {

        /*
         * Temporary Firestore profile.
         *
         * Authentication account creation
         * will later be moved to a secure
         * server-side function.
         */

        const profileId =
          crypto.randomUUID();


        await setDoc(
          doc(
            db,
            "users",
            profileId
          ),
          {

            uid: profileId,

            name: name,

            email: email,

            role: "user",

            status: "active",

            createdBy:
              currentAdmin.uid,

            createdAt:
              serverTimestamp()

          }
        );


        message.style.color =
          "#63e6be";


        message.textContent =
          "User profile created.";


        document
          .getElementById(
            "userForm"
          )
          .reset();


        await loadUsers();


        setTimeout(
          () => {

            modal.classList.remove(
              "show"
            );

            message.textContent =
              "";

          },
          800
        );


      } catch (error) {

        console.error(
          error
        );


        message.textContent =
          error.message;

      }

    }
  );



/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(
  value
) {

  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ==========================================
   LOGOUT
========================================== */

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {

      await signOut(
        auth
      );

      window.location.href =
        "index.html";

    }
  );

</script>

</body>
</html>
