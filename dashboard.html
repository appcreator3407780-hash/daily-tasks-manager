<!doctype html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>Dashboard — Daily Tasks Manager</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>
:root{
  --bg:#060a12;
  --bg2:#0a1020;
  --panel:rgba(15,23,42,.78);
  --panel2:#111b2e;
  --border:rgba(148,163,184,.12);
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#6366f1;
  --primary2:#8b5cf6;
  --cyan:#22d3ee;
  --green:#34d399;
  --red:#fb7185;
  --yellow:#fbbf24;
  --shadow:0 20px 60px rgba(0,0,0,.32);
  --radius:22px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(99,102,241,.16),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(34,211,238,.10),transparent 28%),
    linear-gradient(145deg,#050812,#08101f 50%,#060a12);
}

/* APP */

.app{
  min-height:100vh;
}

/* TOP BAR */

.topbar{
  height:76px;
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:rgba(6,10,18,.78);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-mark{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  color:white;
  font-size:20px;
  font-weight:800;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 10px 30px rgba(99,102,241,.35);
}

.brand strong{
  display:block;
  font-size:15px;
  letter-spacing:-.3px;
}

.brand small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:500;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-chip{
  min-height:38px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:12px;
  color:#dbeafe;
  background:rgba(15,23,42,.7);
  font-size:13px;
  font-weight:600;
}

/* LAYOUT */

.layout{
  display:flex;
  min-height:calc(100vh - 76px);
}

.sidebar{
  width:250px;
  flex-shrink:0;
  padding:24px 16px;
  border-right:1px solid var(--border);
  background:rgba(7,12,22,.68);
}

.nav{
  width:100%;
  height:48px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:7px;
  padding:0 15px;
  border:1px solid transparent;
  border-radius:14px;
  background:transparent;
  color:#94a3b8;
  text-align:left;
  font:600 13px Inter,sans-serif;
  cursor:pointer;
  transition:.2s ease;
}

.nav:hover{
  color:white;
  background:rgba(255,255,255,.045);
}

.nav.active{
  color:white;
  border-color:rgba(99,102,241,.22);
  background:
    linear-gradient(135deg,rgba(99,102,241,.20),rgba(139,92,246,.08));
  box-shadow:inset 3px 0 0 var(--primary);
}

.main{
  flex:1;
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:32px;
}

/* PAGES */

.page{
  display:none;
  animation:pageIn .28s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* GENERAL ELEMENTS */

button,
input,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px;
}

.page-title h1{
  margin:0;
  font-size:30px;
  letter-spacing:-1px;
}

.page-title p{
  margin:7px 0 0;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.primary{
  min-height:44px;
  padding:0 18px;
  border:0;
  border-radius:13px;
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  box-shadow:0 12px 30px rgba(99,102,241,.22);
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

.primary:hover{
  transform:translateY(-1px);
  box-shadow:0 16px 34px rgba(99,102,241,.30);
}

.ghost{
  min-height:40px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:12px;
  color:#dbeafe;
  background:rgba(15,23,42,.65);
  font-weight:600;
  cursor:pointer;
  transition:.2s ease;
}

.ghost:hover{
  background:rgba(255,255,255,.07);
  border-color:rgba(148,163,184,.22);
}

.danger{
  min-height:40px;
  padding:0 14px;
  border:1px solid rgba(251,113,133,.2);
  border-radius:12px;
  color:#fecdd3;
  background:rgba(127,29,29,.22);
  font-weight:600;
  cursor:pointer;
}

.full{
  width:100%;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:20px;
}

.stat{
  position:relative;
  overflow:hidden;
  min-height:130px;
  padding:22px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(
    145deg,
    rgba(15,23,42,.92),
    rgba(15,23,42,.55)
  );
  box-shadow:var(--shadow);
}

.stat::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  right:-35px;
  top:-35px;
  border-radius:50%;
  background:rgba(99,102,241,.12);
  filter:blur(2px);
}

.stat b{
  position:relative;
  z-index:1;
  display:block;
  margin-bottom:10px;
  font-size:32px;
  letter-spacing:-1px;
}

.stat span{
  position:relative;
  z-index:1;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

/* PANELS */

.panel,
.list,
.task-card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:rgba(15,23,42,.70);
  box-shadow:var(--shadow);
}

.panel{
  padding:24px;
}

.panel h2{
  margin:0 0 22px;
  font-size:17px;
}

/* PROGRESS */

.progress-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid rgba(148,163,184,.08);
  color:#cbd5e1;
  font-size:13px;
}

.progress-row:last-child{
  border-bottom:0;
}

.progress-row b{
  color:white;
}

/* LIST */

.list{
  overflow:hidden;
}

.card-row{
  min-height:76px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 19px;
  border-bottom:1px solid rgba(148,163,184,.08);
}

.card-row:last-child{
  border-bottom:0;
}

.card-row > div:first-child{
  min-width:0;
}

.card-row b{
  display:block;
  font-size:13px;
}

.card-row small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.grow{
  flex:1;
}

.avatar{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  border-radius:13px;
  color:white;
  background:linear-gradient(135deg,#334155,#6366f1);
  font-weight:800;
}

.row-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:27px;
  padding:0 9px;
  border-radius:999px;
  background:rgba(148,163,184,.10);
  color:#cbd5e1;
  font-size:10px;
  font-weight:700;
  text-transform:capitalize;
}

.badge.active,
.badge.completed{
  color:#86efac;
  background:rgba(34,197,94,.10);
}

.badge.disabled{
  color:#fda4af;
  background:rgba(244,63,94,.10);
}

.badge.in_progress{
  color:#67e8f9;
  background:rgba(6,182,212,.10);
}

.badge.pending{
  color:#fcd34d;
  background:rgba(245,158,11,.10);
}

.empty{
  padding:55px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */

.search{
  width:100%;
  height:46px;
  margin-bottom:15px;
  padding:0 15px;
  outline:none;
  border:1px solid var(--border);
  border-radius:14px;
  color:white;
  background:rgba(15,23,42,.75);
}

.search:focus{
  border-color:rgba(99,102,241,.55);
  box-shadow:0 0 0 4px rgba(99,102,241,.08);
}

.search::placeholder{
  color:#64748b;
}

/* TASKS */

.task-list{
  display:grid;
  gap:12px;
}

.task-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:20px;
}

.task-main{
  min-width:0;
}

.task-main b{
  display:block;
  margin-bottom:7px;
  font-size:14px;
}

.task-main p{
  margin:0 0 9px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.task-main small{
  color:#64748b;
  font-size:10px;
}

.task-side{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.task-side select{
  height:38px;
  padding:0 10px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  color:white;
  background:#101827;
}

/* MODAL */

#modalRoot{
  position:relative;
  z-index:100;
}

.modal{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal-card{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:24px;
  border:1px solid rgba(148,163,184,.16);
  border-radius:24px;
  background:
    linear-gradient(145deg,#101a2d,#0b1322);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
  animation:modalIn .22s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:11px;
  color:#cbd5e1;
  background:rgba(255,255,255,.04);
  font-size:23px;
  cursor:pointer;
}

.modal-card label{
  display:block;
  margin-bottom:15px;
  color:#cbd5e1;
  font-size:12px;
  font-weight:600;
}

.modal-card input,
.modal-card textarea,
.modal-card select{
  width:100%;
  margin-top:7px;
  padding:0 13px;
  height:45px;
  outline:none;
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  background:rgba(6,10,18,.75);
}

.modal-card textarea{
  height:100px;
  padding-top:12px;
  resize:vertical;
}

.modal-card input:focus,
.modal-card textarea:focus,
.modal-card select:focus{
  border-color:rgba(99,102,241,.55);
}

.password-wrap{
  position:relative;
  display:block;
}

.password-wrap input{
  padding-right:48px;
}

.eye{
  position:absolute;
  right:7px;
  bottom:4px;
  width:36px;
  height:36px;
  border:0;
  border-radius:9px;
  color:white;
  background:transparent;
  cursor:pointer;
}

.message{
  min-height:20px;
  margin-top:12px;
  color:#fb7185;
  font-size:12px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:22px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail-grid > div{
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(255,255,255,.025);
}

.detail-grid span{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:10px;
}

.detail-grid b{
  font-size:12px;
}

/* PROGRESS BAR */

.bar{
  height:8px;
  overflow:hidden;
  margin-top:10px;
  border-radius:999px;
  background:#172033;
}

.bar i{
  display:block;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--primary),var(--cyan));
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:200;
  max-width:calc(100% - 30px);
  padding:12px 17px;
  border:1px solid var(--border);
  border-radius:13px;
  color:white;
  background:#111827;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  font-size:12px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,15px);
  transition:.25s ease;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* TABLET */

@media(max-width:900px){

  .sidebar{
    width:210px;
  }

  .main{
    padding:24px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

/* MOBILE */

@media(max-width:700px){

  .topbar{
    height:68px;
    padding:0 15px;
  }

  .brand strong{
    font-size:13px;
  }

  .brand small{
    font-size:9px;
  }

  .brand-mark{
    width:37px;
    height:37px;
    border-radius:11px;
  }

  .user-chip{
    display:none;
  }

  .layout{
    display:block;
    min-height:calc(100vh - 68px);
    padding-bottom:76px;
  }

  .sidebar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:60;
    width:auto;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-around;
    gap:3px;
    padding:8px 7px;
    border:0;
    border-top:1px solid var(--border);
    background:rgba(6,10,18,.88);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .nav{
    flex:1;
    width:auto;
    height:54px;
    justify-content:center;
    margin:0;
    padding:0 5px;
    border-radius:12px;
    font-size:10px;
  }

  .nav.active{
    box-shadow:none;
  }

  .main{
    padding:20px 15px;
  }

  .page-title{
    align-items:flex-start;
    margin-bottom:20px;
  }

  .page-title h1{
    font-size:24px;
  }

  .page-title .primary{
    flex-shrink:0;
    padding:0 12px;
    font-size:11px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    min-height:105px;
    padding:17px;
    border-radius:17px;
  }

  .stat b{
    font-size:25px;
  }

  .stat span{
    font-size:10px;
  }

  .panel{
    padding:18px;
    border-radius:18px;
  }

  .card-row{
    align-items:flex-start;
    padding:15px;
  }

  .row-actions{
    flex-direction:column;
    align-items:flex-end;
  }

  .task-card{
    align-items:flex-start;
    flex-direction:column;
    padding:17px;
  }

  .task-side{
    width:100%;
    justify-content:space-between;
  }

  .task-side select{
    max-width:160px;
  }

  .modal-card{
    padding:19px;
    border-radius:20px;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }
}

/* SMALL PHONES */

@media(max-width:400px){

  .stats{
    gap:8px;
  }

  .stat{
    padding:14px;
  }

  .stat b{
    font-size:22px;
  }

  .nav{
    font-size:9px;
  }

  .top-actions .ghost{
    padding:0 10px;
    font-size:11px;
  }
}
</style></head><body><div id="app" class="app">  <!-- TOP BAR -->  <header class="topbar"><div class="brand">

  <div class="brand-mark small">
    ✓
  </div>

  <div>
    <strong>Daily Tasks Manager</strong>
    <small id="roleLabel">Dashboard</small>
  </div>

</div>

<div class="top-actions">

  <span id="userName" class="user-chip"></span>

  <button id="logoutBtn" class="ghost">
    Logout
  </button>

</div>

  </header>  <!-- MAIN LAYOUT -->  <div class="layout"><!-- SIDEBAR / MOBILE NAV -->
<aside class="sidebar">

  <button
    data-page="overview"
    class="nav active">
    ◈&nbsp; Overview
  </button>

  <button
    data-page="admins"
    class="nav super-only">
    ♛&nbsp; Admins
  </button>

  <button
    data-page="users"
    class="nav admin-visible">
    ◉&nbsp; Users
  </button>

  <button
    data-page="groups"
    class="nav admin-visible">
    ◎&nbsp; Groups
  </button>

  <button
    data-page="tasks"
    class="nav user-visible">
    ✓&nbsp; Tasks
  </button>

</aside>


<!-- CONTENT -->
<main class="main">

  <section
    id="page-overview"
    class="page active">
  </section>

  <section
    id="page-admins"
    class="page">
  </section>

  <section
    id="page-users"
    class="page">
  </section>

  <section
    id="page-groups"
    class="page">
  </section>

  <section
    id="page-tasks"
    class="page">
  </section>

</main>

  </div></div><!-- MODALS --><div id="modalRoot"></div><!-- TOAST --><div id="toast"></div><!-- APP JAVASCRIPT --><script
  type="module"
  src="js/app.js">
</script></body>
