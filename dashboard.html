<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080b14"
  >

  <title>Daily Tasks Manager</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    body {
      background: #080b14;
    }

    .dashboard {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: rgba(8, 11, 20, 0.92);

      border-bottom: 1px solid #20283b;

      backdrop-filter: blur(16px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-logo {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #5b7cff;

      color: white;

      font-size: 22px;
      font-weight: 800;
    }

    .top-title {
      font-size: 18px;
      font-weight: 700;
    }

    .top-subtitle {
      color: #929bb0;
      font-size: 12px;
      margin-top: 2px;
    }

    .logout-btn {
      border: 1px solid #30394e;

      background: #111625;

      color: #dce2f2;

      padding: 9px 15px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 600;
    }

    .logout-btn:hover {
      background: #1a2031;
    }


    /* CONTENT */

    .content {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 30px 20px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #929bb0;
      margin-bottom: 26px;
    }


    /* STATS */

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;

      margin-bottom: 30px;
    }

    .stat-card {
      background: #111625;

      border: 1px solid #20283b;

      border-radius: 18px;

      padding: 20px;
    }

    .stat-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #1a2236;

      font-size: 20px;

      margin-bottom: 15px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
    }

    .stat-label {
      color: #929bb0;

      font-size: 13px;

      margin-top: 5px;
    }


    /* SECTIONS */

    .section-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 20px;
    }

    .panel {
      background: #111625;

      border: 1px solid #20283b;

      border-radius: 18px;

      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #20283b;
    }

    .panel-header h2 {
      font-size: 17px;
    }

    .panel-header button {
      border: 0;

      background: #5b7cff;

      color: white;

      padding: 8px 12px;

      border-radius: 9px;

      cursor: pointer;

      font-weight: 600;
    }

    .panel-body {
      padding: 20px;
    }


    /* QUICK ACTIONS */

    .actions {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .action {
      border: 1px solid #252e43;

      background: #0c111e;

      color: white;

      border-radius: 13px;

      padding: 18px;

      cursor: pointer;

      text-align: left;

      transition: 0.2s;
    }

    .action:hover {
      border-color: #5b7cff;

      transform: translateY(-2px);
    }

    .action-icon {
      font-size: 22px;

      margin-bottom: 9px;
    }

    .action-title {
      font-weight: 700;

      margin-bottom: 4px;
    }

    .action-text {
      color: #929bb0;

      font-size: 12px;
    }


    /* EMPTY */

    .empty {
      text-align: center;

      padding: 30px 10px;

      color: #929bb0;
    }

    .empty-icon {
      font-size: 35px;

      margin-bottom: 10px;
    }


    /* MOBILE */

    @media (max-width: 800px) {

      .stats-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .section-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 500px) {

      .topbar {
        padding: 0 15px;
      }

      .top-title {
        font-size: 15px;
      }

      .content {
        padding: 24px 15px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .stats-grid {
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 24px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<div class="dashboard">


  <!-- TOP BAR -->

  <header class="topbar">

    <div class="topbar-left">

      <div class="top-logo">
        ✓
      </div>

      <div>

        <div class="top-title">
          Daily Tasks Manager
        </div>

        <div class="top-subtitle">
          Admin Dashboard
        </div>

      </div>

    </div>


    <button
      id="logoutBtn"
      class="logout-btn"
    >
      Logout
    </button>

  </header>



  <!-- CONTENT -->

  <main class="content">


    <!-- WELCOME -->

    <section class="welcome">

      <h1>
        Dashboard
      </h1>

      <p id="welcomeText">
        Welcome back.
      </p>

    </section>



    <!-- STATS -->

    <section class="stats-grid">


      <div class="stat-card">

        <div class="stat-icon">
          👥
        </div>

        <div
          id="totalUsers"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Total Users
        </div>

      </div>



      <div class="stat-card">

        <div class="stat-icon">
          📋
        </div>

        <div
          id="totalTasks"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Total Tasks
        </div>

      </div>



      <div class="stat-card">

        <div class="stat-icon">
          ⏳
        </div>

        <div
          id="progressTasks"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          In Progress
        </div>

      </div>



      <div class="stat-card">

        <div class="stat-icon">
          ✓
        </div>

        <div
          id="completedTasks"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Completed
        </div>

      </div>


    </section>



    <!-- PANELS -->

    <section class="section-grid">


      <!-- QUICK ACTIONS -->

      <div class="panel">

        <div class="panel-header">

          <h2>
            Quick Actions
          </h2>

        </div>


        <div class="panel-body">

          <div class="actions">


            <button
              class="action"
              onclick="alert('Users module coming next')"
            >

              <div class="action-icon">
                👥
              </div>

              <div class="action-title">
                Manage Users
              </div>

              <div class="action-text">
                Create, edit and manage users
              </div>

            </button>



            <button
              class="action"
              onclick="alert('Tasks module coming next')"
            >

              <div class="action-icon">
                📋
              </div>

              <div class="action-title">
                Manage Tasks
              </div>

              <div class="action-text">
                Assign and track tasks
              </div>

            </button>



            <button
              class="action"
              onclick="alert('Groups module coming next')"
            >

              <div class="action-icon">
                👥
              </div>

              <div class="action-title">
                User Groups
              </div>

              <div class="action-text">
                Organize users into groups
              </div>

            </button>



            <button
              class="action"
              onclick="alert('Reports module coming next')"
            >

              <div class="action-icon">
                📊
              </div>

              <div class="action-title">
                Reports
              </div>

              <div class="action-text">
                View task progress and analytics
              </div>

            </button>


          </div>

        </div>

      </div>



      <!-- RECENT TASKS -->

      <div class="panel">

        <div class="panel-header">

          <h2>
            Recent Tasks
          </h2>

          <button
            onclick="alert('Task manager coming next')"
          >
            View All
          </button>

        </div>


        <div class="panel-body">

          <div class="empty">

            <div class="empty-icon">
              📋
            </div>

            <div>
              No tasks yet
            </div>

            <small>
              Create your first task to see it here.
            </small>

          </div>

        </div>

      </div>


    </section>


  </main>

</div>



<script type="module">

  import {
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


  import {
    doc,
    getDoc
  } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


  import {
    auth,
    db
  } from "./js/firebase-config.js";


  /*
   * Check login
   */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "index.html";

        return;

      }


      try {

        const profile =
          await getDoc(
            doc(db, "users", user.uid)
          );


        if (!profile.exists()) {

          await signOut(auth);

          window.location.href =
            "index.html";

          return;

        }


        const data =
          profile.data();


        document
          .getElementById("welcomeText")
          .textContent =
          "Welcome back, " +
          (data.name || "Admin") +
          ".";


      } catch (error) {

        console.error(
          "Profile error:",
          error
        );

      }

    }
  );


  /*
   * Logout
   */

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          window.location.href =
            "index.html";

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        }

      }
    );

</script>


</body>

</html>
