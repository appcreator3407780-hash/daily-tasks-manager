<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08101f">
<title>Dashboard — Daily Tasks Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark small">✓</div>
      <div><strong>Daily Tasks Manager</strong><small id="roleLabel">Dashboard</small></div>
    </div>
    <div class="top-actions">
      <span id="userName" class="user-chip"></span>
      <button id="logoutBtn" class="ghost">Logout</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button data-page="overview" class="nav active">Overview</button>
      <button data-page="admins" class="nav super-only">Admins</button>
      <button data-page="users" class="nav admin-visible">Users</button>
      <button data-page="groups" class="nav admin-visible">Groups</button>
      <button data-page="tasks" class="nav user-visible">Tasks</button>
    </aside>

    <main class="main">
      <section id="page-overview" class="page active"></section>
      <section id="page-admins" class="page"></section>
      <section id="page-users" class="page"></section>
      <section id="page-groups" class="page"></section>
      <section id="page-tasks" class="page"></section>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
